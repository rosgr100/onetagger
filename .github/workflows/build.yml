name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  build-mac-universal:
    name: macOS
    runs-on: macos-14

    steps:
    - name: Checkout v4
      uses: actions/checkout@v4 # Use the latest checkout action for better performance and reliability

    - name: Rust Cache v4
      uses: actions/cache@v4 # Use the latest cache action for improved caching performance and reliability
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Initialize & update the default Rust toolchain
      run: |
        rustup update stable
        rustup default stable
        
        source "$HOME/.cargo/env"
        
        rustup target add x86_64-apple-darwin
        rustup target add aarch64-apple-darwin
        
        if ! command -v cargo-bundle &> /dev/null; then
          cargo install cargo-bundle --version 0.6.1 --locked
        fi
    
    - name: Install NodeJS 18
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install pnpm 8
      uses: pnpm/action-setup@v4
      with:
        version: 8

    - name: Build UI via PNPM
      run: |
        cd client
        pnpm i
        pnpm run build
        
    - name: Build macOS Intel & Apple Silicon Architecture Binaries
      run: |
        source "$HOME/.cargo/env"

        cd client
        cd ..
        cargo update

        # Intel x86_64
        cargo build --release --target x86_64-apple-darwin
        cargo bundle --release --target x86_64-apple-darwin

        # Apple Silicon (M1/M2/M3/M4/M5 etc)
        cargo build --release --target aarch64-apple-darwin
        cargo bundle --release --target aarch64-apple-darwin

    - name: Create Universal Bundle
      run: |
        mkdir dist

        # Use the compiled ARM64 App bundle structure as our template base
        cp -R target/aarch64-apple-darwin/release/bundle/osx/OneTagger.app .

        # Combine the main application binary inside the app bundle template
        lipo -create \
          target/x86_64-apple-darwin/release/bundle/osx/OneTagger.app/Contents/MacOS/onetagger \
          target/aarch64-apple-darwin/release/bundle/osx/OneTagger.app/Contents/MacOS/onetagger \
          -output OneTagger.app/Contents/MacOS/onetagger

        # Combine the standalone CLI binary
        lipo -create \
          target/x86_64-apple-darwin/release/onetagger-cli \
          target/aarch64-apple-darwin/release/onetagger-cli \
          -output onetagger-cli

        # Verify that they are now universal binaries
        file OneTagger.app/Contents/MacOS/onetagger
        file onetagger-cli

        # Grant execution permissions now that the universal files exist
        chmod +x OneTagger.app/Contents/MacOS/onetagger
        chmod +x onetagger-cli

        # Package the Universal App Bundle
        zip -r dist/OneTagger-mac-universal.zip OneTagger.app

        # Package the Universal CLI Binary
        zip dist/OneTagger-mac-universal-cli.zip onetagger-cli

    - name: Upload Universal Mac App
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-mac-universal
        path: dist/OneTagger-mac-universal.zip

    - name: Upload Universal Mac CLI
      uses: actions/upload-artifact@v4
      with:
        name: onetagger-mac-universal-cli
        path: dist/OneTagger-mac-universal-cli.zip
